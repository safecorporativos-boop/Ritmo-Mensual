<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#002B5B" />
  <meta name="description" content="Ritmo Mensual - Organiza tu mes por áreas de forma simple y visual" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ritmo Mensual" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Ritmo Mensual</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="variables.css" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="layout.css" />
  <link rel="stylesheet" href="board.css" />
  <link rel="stylesheet" href="components.css" />

  <style>
    /* ===== HOME: grid de áreas ===== */
    .home-view {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 100px;
    }

    .home-greeting {
      margin-bottom: 20px;
    }

    .home-greeting h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .home-greeting p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .areas-home-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 600px) {
      .areas-home-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .home-area-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 22px 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .home-area-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .home-area-card[data-area="cocina"]::before { background: var(--area-cocina); }
    .home-area-card[data-area="trabajo"]::before { background: var(--area-trabajo); }
    .home-area-card[data-area="personal"]::before { background: var(--area-personal); }
    .home-area-card[data-area="compras"]::before { background: var(--area-compras); }
    .home-area-card[data-area="ahorros"]::before { background: var(--area-ahorros); }
    .home-area-card[data-area="metas"]::before { background: var(--area-metas); }

    .home-area-card:active {
      transform: scale(0.97);
    }

    .home-area-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .home-area-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .home-area-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-muted);
      padding: 3px 10px;
      border-radius: 99px;
    }

    /* ===== AREA DETAIL VIEW ===== */
    .area-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .area-view-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
    }

    .area-view-header h2 {
      font-size: 1.15rem;
      font-weight: 600;
      flex: 1;
    }

    .area-view-tasks {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .area-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .area-empty span {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .area-view-fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--text-inverse);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px color-mix(in srgb, var(--primary) 40%, transparent);
      z-index: 40;
      border: none;
      cursor: pointer;
    }

    .area-view-fab:active {
      transform: scale(0.95);
    }

    /* Task card in list */
    .task-list-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: box-shadow 0.15s;
    }

    .task-list-card:active {
      box-shadow: var(--shadow-md);
    }

    .task-list-card.completed {
      opacity: 0.6;
    }

    .task-list-card.completed .task-list-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-list-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-list-check {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border-strong);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-top: 1px;
      cursor: pointer;
    }

    .task-list-card.completed .task-list-check {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .task-list-title {
      font-weight: 500;
      font-size: 0.95rem;
      flex: 1;
      word-break: break-word;
    }

    .task-list-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      margin-left: 34px;
    }

    /* Hide old board when using new views */
    .board-container { display: none !important; }
    .area-chips { display: none !important; }

    .view-hidden { display: none !important; }
  </style>
</head>
<body data-theme="coral">

  <!-- ========== AUTH SCREEN ========== -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">📅</span>
        <h1>Ritmo Mensual</h1>
        <p>Organiza tu mes con claridad</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Iniciar sesión</button>
        <button class="auth-tab" data-tab="register">Crear cuenta</button>
      </div>

      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
        <button type="button" class="btn btn-ghost btn-full" id="magic-link-btn">Entrar con Magic Link</button>
      </form>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="register-name">Nombre</label>
          <input type="text" id="register-name" placeholder="Cómo te llamas" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="register-email">Correo electrónico</label>
          <input type="email" id="register-email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="register-password">Contraseña</label>
          <input type="password" id="register-password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Crear cuenta</button>
      </form>

      <p class="auth-footer">Tus datos están protegidos y solo tú puedes verlos</p>
    </div>
  </div>

  <!-- ========== APP SHELL ========== -->
  <div id="app" class="app hidden">
    <header class="header">
      <div class="header-left">
        <button id="back-btn" class="icon-btn view-hidden" aria-label="Volver">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="brand">
          <span class="brand-icon">📅</span>
          <span class="brand-name">Ritmo Mensual</span>
        </div>
      </div>

      <div class="header-center">
        <button id="prev-month" class="icon-btn" aria-label="Mes anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2 id="current-month" class="current-month">Septiembre 2026</h2>
        <button id="next-month" class="icon-btn" aria-label="Mes siguiente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="header-right">
        <button id="theme-btn" class="icon-btn" aria-label="Cambiar tema" title="Cambiar tema">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
        <button id="export-btn" class="icon-btn" aria-label="Exportar" title="Exportar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <div class="user-menu">
          <button id="user-btn" class="user-btn">
            <span id="user-avatar" class="user-avatar">U</span>
          </button>
          <div id="user-dropdown" class="dropdown hidden">
            <div class="dropdown-header">
              <strong id="user-name">Usuario</strong>
              <span id="user-email" class="text-muted">email@example.com</span>
            </div>
            <button class="dropdown-item" id="logout-btn">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Theme panel -->
    <div id="theme-panel" class="theme-panel hidden">
      <div class="theme-panel-header">
        <h3>Elige tu tema</h3>
        <button id="close-theme" class="icon-btn">✕</button>
      </div>
      <div class="theme-options">
        <button class="theme-option" data-theme="teal">
          <div class="theme-preview theme-preview-teal"></div>
          <span>Turquesa</span>
        </button>
        <button class="theme-option active" data-theme="coral">
          <div class="theme-preview theme-preview-coral"></div>
          <span>Coral Navy</span>
        </button>
        <button class="theme-option" data-theme="soft">
          <div class="theme-preview theme-preview-soft"></div>
          <span>Pastel Suave</span>
        </button>
        <button class="theme-option" data-theme="bright">
          <div class="theme-preview theme-preview-bright"></div>
          <span>Pastel Vivo</span>
        </button>
      </div>
    </div>

    <!-- ===== HOME VIEW: grid de áreas ===== -->
    <div id="home-view" class="home-view">
      <div class="home-greeting">
        <h2 id="greeting-text">Hola</h2>
        <p>Elige un área para organizar tu mes</p>
      </div>
      <div class="areas-home-grid" id="areas-home-grid">
        <!-- Se llena con JS -->
      </div>
    </div>

    <!-- ===== AREA DETAIL VIEW ===== -->
    <div id="area-view" class="area-view view-hidden">
      <div class="area-view-header">
        <span id="area-view-icon" style="font-size:1.4rem"></span>
        <h2 id="area-view-title">Área</h2>
        <span id="area-view-count" class="column-count">0</span>
      </div>
      <div class="area-view-tasks" id="area-view-tasks">
        <!-- Tareas de esta área -->
      </div>
      <button id="area-fab" class="area-view-fab" aria-label="Nueva tarea">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <!-- FAB global (home) -->
    <button id="fab-add" class="fab" aria-label="Nueva tarea">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <!-- ========== MODAL: Nueva / Editar Tarea ========== -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Nueva tarea</h3>
        <button class="icon-btn modal-close" aria-label="Cerrar">✕</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        <div class="form-group">
          <label for="task-title">Título *</label>
          <input type="text" id="task-title" placeholder="¿Qué necesitas hacer?" required maxlength="120" />
        </div>
        <div class="form-group">
          <label for="task-area">Área</label>
          <select id="task-area">
            <option value="cocina">🍳 Cocina</option>
            <option value="trabajo">💼 Trabajo</option>
            <option value="personal">👤 Personal</option>
            <option value="compras">🛒 Compras</option>
            <option value="ahorros">💰 Ahorros</option>
            <option value="metas">🎯 Metas / Objetivos</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Prioridad</label>
            <select id="task-priority">
              <option value="low">Baja</option>
              <option value="medium" selected>Media</option>
              <option value="high">Alta</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-due">Fecha</label>
            <input type="date" id="task-due" />
          </div>
        </div>
        <div class="form-group">
          <label for="task-notes">Notas</label>
          <textarea id="task-notes" rows="3" placeholder="Detalles opcionales..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost modal-close">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== BOTTOM SHEET: Elegir área ========== -->
  <div id="area-sheet" class="bottom-sheet hidden">
    <div class="bottom-sheet-backdrop"></div>
    <div class="bottom-sheet-content">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">¿En qué área?</h3>
      <div class="area-grid">
        <button class="area-card" data-area="cocina">
          <span class="area-card-icon">🍳</span>
          <span class="area-card-label">Cocina</span>
        </button>
        <button class="area-card" data-area="trabajo">
          <span class="area-card-icon">💼</span>
          <span class="area-card-label">Trabajo</span>
        </button>
        <button class="area-card" data-area="personal">
          <span class="area-card-icon">👤</span>
          <span class="area-card-label">Personal</span>
        </button>
        <button class="area-card" data-area="compras">
          <span class="area-card-icon">🛒</span>
          <span class="area-card-label">Compras</span>
        </button>
        <button class="area-card" data-area="ahorros">
          <span class="area-card-icon">💰</span>
          <span class="area-card-label">Ahorros</span>
        </button>
        <button class="area-card" data-area="metas">
          <span class="area-card-icon">🎯</span>
          <span class="area-card-label">Metas</span>
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
